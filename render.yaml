databases: []

services:
  # ── Backend: FastAPI on free Web Service ────────────────────────────
  # Free plan: spins down after 15 min idle (cold start ~30-60s on wake).
  # Persistence comes from external Postgres (Neon), not local disk.
  - type: web
    name: steel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn steel_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Postgres connection string from Neon (free tier).
      # Paste in Render dashboard. Format:
      #   postgresql://user:pass@ep-xxx.region.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Auth / cookies: the frontend proxies /api/* via Next.js rewrites
      # (see frontend/next.config.ts → API_PROXY_TARGET), so the browser
      # sees every request as same-origin. SameSite=lax is enough; SameSite=
      # none would force third-party-cookie semantics which Chrome blocks
      # on free *.onrender.com subdomains.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "lax"

      # Set FRONTEND_ORIGIN to the frontend's URL after first deploy.
      - key: FRONTEND_ORIGIN
        sync: false

      # Secrets: paste in Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      - key: STEELNET_USER
        sync: false
      - key: STEELNET_PASSWORD
        sync: false

  # ── Frontend: Next.js ───────────────────────────────────────────────
  - type: web
    name: steel-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      # Empty so api.ts uses relative URLs (/api/...) — same-origin from
      # the browser. Must be set explicitly to "" rather than unset, since
      # api.ts falls back to http://localhost:8001 when the var is missing.
      - key: NEXT_PUBLIC_API_BASE
        value: ""
      # Server-side only: Next.js rewrites /api/* → this URL inside the
      # frontend's Node process. Set this to the backend's onrender.com URL.
      - key: API_PROXY_TARGET
        sync: false
