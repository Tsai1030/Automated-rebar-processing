databases: []

services:
  # ── Backend: FastAPI on free Web Service ────────────────────────────
  # Free plan: spins down after 15 min idle (cold start ~30-60s on wake).
  # Persistence comes from external Postgres (Neon), not local disk.
  - type: web
    name: steel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn steel_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Postgres connection string from Neon (free tier).
      # Paste in Render dashboard. Format:
      #   postgresql://user:pass@ep-xxx.region.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Auth / cookies: cross-site between *-frontend.onrender.com and
      # *-backend.onrender.com requires SameSite=None + Secure.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"

      # Set FRONTEND_ORIGIN to the frontend's URL after first deploy.
      - key: FRONTEND_ORIGIN
        sync: false

      # Secrets: paste in Render dashboard.
      - key: OPENAI_API_KEY
        sync: false
      - key: STEELNET_USER
        sync: false
      - key: STEELNET_PASSWORD
        sync: false

  # ── Frontend: Next.js ───────────────────────────────────────────────
  - type: web
    name: steel-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      # NEXT_PUBLIC_* is inlined at build time — set this to the backend URL
      # BEFORE the first frontend build, otherwise the bundle will point at
      # localhost. After backend deploys, copy its URL here and redeploy.
      - key: NEXT_PUBLIC_API_BASE
        sync: false
